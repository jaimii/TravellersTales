# BossBar Styles:  PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
# ==============================================================================

# ==============================================================================
# WEAPON RESISTANCE SETTINGS (Mace & Spear Reduction)
# ==============================================================================
weapon-resistance:
  enabled: true
  only-bosses: false
  damage-multiplier: 0.25


